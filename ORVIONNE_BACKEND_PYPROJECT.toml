[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orvionne-api"
version = "0.1.0"
description = "FastAPI backend for ORVIONNE Business Intelligence powered by Private AI."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.124.0,<1.0.0",
  "uvicorn[standard]>=0.38.0,<1.0.0",
  "pydantic-settings>=2.12.0,<3.0.0",
  "sqlalchemy>=2.0.45,<3.0.0",
  "alembic>=1.17.0,<2.0.0",
  "psycopg[binary]>=3.3.0,<4.0.0",
  "pgvector>=0.4.2,<1.0.0",
  "redis>=7.1.0,<8.0.0",
  "anthropic>=0.75.0,<1.0.0",
  "bcrypt>=5.0.0,<6.0.0",
  "email-validator>=2.3.0,<3.0.0",
  "minio>=7.2.20,<8.0.0",
  "PyMuPDF>=1.26.0,<2.0.0",
  "PyJWT>=2.10.1,<3.0.0",
  "python-docx>=1.2.0,<2.0.0",
  "python-multipart>=0.0.21,<1.0.0",
  "cryptography>=43.0,<44.0",
  "PyMySQL>=1.1.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.14.0,<1.0.0",
  "pytest>=9.0.0,<10.0.0",
  "boto3>=1.34,<2.0",
]
kms = [
  "boto3>=1.34,<2.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
